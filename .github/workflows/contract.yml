name: contract
on:
  pull_request:
  push:
    branches: [qa]
  workflow_dispatch:
jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Spec presente
        run: test -f specs/001-estado-instancia/spec.md
      - run: npm test
